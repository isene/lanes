{% extends "base.html" %}
{% block body %}
<form method="post" class="box">
  <div class="hero"><img src="{{ url_for('static', filename='logo.svg') }}" alt=""><p>Every team, one clear board.</p></div>
  <h1>Log in</h1>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Email <input name="email" type="email" required autofocus autocomplete="username"></label>
  <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
  <label>Code from the app on your phone
    <input name="code" inputmode="numeric" required autocomplete="one-time-code"></label>
  <button>Log in</button>
</form>
{% endblock %}
